<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10100f">
  <title>Bedankt — MISTERY DUO</title>
  <style>
    :root{color-scheme:dark;--bg:#10100f;--gold:#d5b773;--text:#f1ede4;--muted:#aaa397}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 25%,#302a1c 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.65 "DM Sans",Arial,sans-serif;padding:24px}
    main{width:min(620px,100%);text-align:center;padding:56px 30px;border:1px solid #d5b77344;background:#161512}
    .mark{font-size:32px;color:var(--gold)}.mark span{font-size:15px}
    h1{font:600 clamp(34px,7vw,54px)/1.1 Georgia,serif;margin:18px 0}
    p{color:var(--muted);max-width:440px;margin:0 auto 28px}
    a{display:inline-block;padding:12px 20px;background:var(--gold);color:#17150f;text-decoration:none;font-weight:700}
    a:focus-visible{outline:3px solid white;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M<span>✦</span></div>
    <h1>Bedankt voor je bericht.</h1>
    <p>Je inzending is ontvangen. Een bestelverzoek is vrijblijvend; MISTERY DUO neemt per e-mail contact op over beschikbaarheid, levering en betaling.</p>
    <a href="./">Terug naar MISTERY DUO</a>
  </main>
</body>
</html>
